plugins { id 'com.android.application' }

android {
    namespace 'in.durgeshkadam.fittrack'
    compileSdk 35
    defaultConfig {
        applicationId 'in.durgeshkadam.fittrack'
        minSdk 24
        targetSdk 35
        versionCode 4
        versionName '1.3.0'
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.17.0'
}

// Keep the APK WebView bundle identical to the web app.
tasks.register('syncWebAssets', Sync) {
    from '../../web'
    into 'src/main/assets/www'
}
preBuild.dependsOn syncWebAssets
